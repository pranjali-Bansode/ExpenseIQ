services:
  - type: web
    name: expenseiq
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # --timeout 60: a little headroom for the OCR.space HTTP call (up to ~25s)
    #   plus normal request handling. No longer need 120s now that OCR runs
    #   on a hosted API instead of loading a local ML model.
    startCommand: gunicorn app:app --timeout 60 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      
      # --- GENERAL CONFIGURATION ---
      - key: SECRET_KEY
        sync: false
      
      # --- FLASK-MAIL CONFIGURATION (Primary - Use These!) ---
      # These are the standard Flask-Mail variables your code should use
      - key: MAIL_SERVER
        value: "smtp.gmail.com"
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "True"
      - key: MAIL_USERNAME
        sync: false
        # Set this in Render dashboard to: your-email@gmail.com
      - key: MAIL_PASSWORD
        sync: false
        # Set this in Render dashboard to: your-16-char-app-password
      
      # --- OCR CONFIGURATION ---
      - key: OCR_SPACE_API_KEY
        sync: false
      
      # --- LEGACY EMAIL VARIABLES (Keep for now, but use MAIL_* above in code) ---
      # These are replaced by MAIL_* variables above. Can be deprecated later.
      - key: ALERT_FROM_EMAIL
        sync: false
      - key: GMAIL_EMAIL
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false