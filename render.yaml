services:
  - type: web
    name: expenseiq
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # --timeout 60: a little headroom for the OCR.space HTTP call (up to ~25s)
    #   plus normal request handling. No longer need 120s now that OCR runs
    #   on a hosted API instead of loading a local ML model.
    startCommand: gunicorn app:app --timeout 60 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      # --- GENERAL CONFIGURATION ---
      - key: SECRET_KEY
        sync: false
       
      - key: FLASK_ENV
        value: "production"

      # --- EMAIL (SendGrid Web API - no SMTP) ---
      - key: SENDGRID_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
        # Must be a verified sender in SendGrid (Settings > Sender Authentication)

      # --- OCR CONFIGURATION ---
      - key: OCR_SPACE_API_KEY
        sync: false